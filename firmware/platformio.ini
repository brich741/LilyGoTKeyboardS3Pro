[platformio]
default_envs = esp32s3
data_dir = data

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
board_build.flash_type = qio
board_build.psram_type = opi
board_build.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DFW_VERSION=\"0.1.0\"
    ; The library finder skips some conditional includes in framework libs (USB, WiFi, LittleFS),
    ; so give every compile unit these framework include dirs explicitly.
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
lib_ldf_mode = deep+
lib_deps =
    lovyan03/LovyanGFX @ ^1.1.0
    lbuque/ButtonSense @ ^1.0.0
    bblanchon/ArduinoJson @ ^7.0.0
    https://github.com/Xinyuan-LilyGO/T-Keyboard-S3-Pro-Library.git

; Host-side unit tests for lib/core (needs a host C++ compiler on PATH).
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

; Diagnostic: LilyGo's stock RGB example, unmodified, to test the LED strip in isolation.
[env:rgbdemo]
extends = env:esp32s3
build_src_filter = -<*> +<../diag/rgb_example.cpp>
